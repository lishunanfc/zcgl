<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<title>资产册</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F2EE; --paper-deep:#E8E8E2; --ink:#1A1A1A; --ink-soft:#666660;
  --ink-faint:#AAAAAA; --green:#5E9E2F; --green-soft:#E8F5C8;
  --green-bright:#C8F135; --green-dark:#3A6B10;
  --rust:#D94F2D; --rust-soft:#FCE8E2; --amber:#D4900A; --amber-soft:#FDF0D0;
  --blue:#2A5FA5; --blue-soft:#E3EAF6;
  --black:#1A1A1A; --card:#FFFFFF;
  --line:#E4E4DE; --radius:20px;
  --shadow:0 2px 8px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.mono{font-family:'JetBrains Mono',monospace;}
.serif{font-family:'Fraunces',serif;}

/* ===== Topbar ===== */
header.topbar{
  padding:calc(20px + env(safe-area-inset-top)) 20px 18px;
  background:var(--black);color:#fff;border-radius:0 0 28px 28px;}
.topbar .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.4;margin:0 0 4px;font-weight:600;}
.topbar h1{font-family:'Inter',sans-serif;font-weight:900;font-size:32px;margin:0 0 16px;
  letter-spacing:-.02em;color:var(--green-bright);}
.stats-row{display:flex;gap:8px;}
.stat-box{flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);
  border-radius:16px;padding:11px 12px;}
.stat-box .label{font-size:10px;opacity:.45;margin-bottom:4px;letter-spacing:.04em;font-weight:600;text-transform:uppercase;}
.stat-box .value{font-family:'Inter',sans-serif;font-size:19px;font-weight:900;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--green-bright);}
.stat-box .value .unit{font-size:11px;font-weight:600;opacity:.7;margin-right:1px;}
.stat-box .sublabel{font-size:10px;opacity:.35;margin-top:3px;}

/* ===== Bottom Nav ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);border-top:1.5px solid var(--line);
  display:flex;align-items:center;
  padding:0 0 env(safe-area-inset-bottom);
  z-index:40;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 0;cursor:pointer;color:var(--ink-faint);font-size:10px;font-weight:600;
  transition:color .15s;}
.nav-btn .nav-icon{font-size:20px;line-height:1;}
.nav-btn.active{color:var(--black);}
.nav-btn.active .nav-icon-wrap{
  background:var(--green-bright);border-radius:12px;
  padding:4px 16px;margin-bottom:2px;
}

/* ===== Pages ===== */
.page{display:none;}
.page.active{display:block;}

/* ===== Reminder banner ===== */
.reminder-banner{margin:14px 20px 0;background:var(--rust-soft);border:1px solid #ECC9B6;
  border-radius:12px;padding:11px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.reminder-banner .text{font-size:13px;color:var(--rust);line-height:1.5;}
.reminder-banner .text b{font-weight:700;}

/* ===== Filter chips ===== */
.filter-bar{display:flex;gap:8px;padding:16px 20px 4px;overflow-x:auto;scrollbar-width:none;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:8px 18px;border-radius:999px;border:2px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--black);border-color:var(--black);color:var(--green-bright);}

/* ===== Asset List ===== */
.list{padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--card);border-radius:var(--radius);border:2px solid var(--line);
  box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:transform .12s ease;}
.card:active{transform:scale(.99);}
.card-top{display:flex;gap:12px;}
.card-thumb{width:56px;height:56px;border-radius:16px;background:var(--black);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  flex-shrink:0;overflow:hidden;border:none;}
.card-thumb img{width:100%;height:100%;object-fit:cover;}
.card-info{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.card-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;font-family:'JetBrains Mono',monospace;}
.card-meta .sep{margin:0 5px;color:var(--ink-faint);}
.card-numbers{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;}
.card-price{font-weight:900;font-size:17px;color:var(--ink);}
.card-daily{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
.card-daily .num{font-weight:700;color:var(--green-dark);}
.gauge-row{margin-top:11px;}
.gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);
  font-family:'JetBrains Mono',monospace;margin-bottom:5px;}
.gauge-status.ok{color:var(--green-dark);font-weight:700;}
.gauge-status.warn{color:var(--amber);font-weight:700;}
.gauge-status.over{color:var(--rust);font-weight:700;}
.gauge-track{height:8px;border-radius:999px;background:var(--paper-deep);overflow:hidden;}
.gauge-fill{height:100%;border-radius:999px;background:var(--green-bright);transition:width .4s ease;}
.gauge-fill.warn{background:var(--amber);}
.gauge-fill.over{background:var(--rust);}
.status-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700;margin-left:6px;}
.status-tag.serving{background:var(--green-soft);color:var(--green-dark);}
.status-tag.retired{background:var(--paper-deep);color:var(--ink-soft);}
.status-tag.sold{background:var(--rust-soft);color:var(--rust);}

/* ===== Quip bubble — Style 1: 亮绿横幅 + 黑圆表情 ===== */
.quip-bubble{
  margin-top:11px;
  background:var(--green-bright);
  border-radius:14px;
  padding:9px 12px 9px 9px;
  display:flex;
  align-items:center;
  gap:9px;
}
.quip-badge{
  width:32px;height:32px;border-radius:50%;
  background:var(--black);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.quip-text{
  font-size:12.5px;font-weight:700;color:var(--green-dark);
  line-height:1.45;flex:1;
}

/* ===== Empty state ===== */
.empty-state{text-align:center;padding:60px 30px;color:var(--ink-soft);}
.empty-state .icon{font-size:40px;margin-bottom:14px;opacity:.5;}
.empty-state h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 6px;color:var(--ink);}
.empty-state p{font-size:13px;margin:0;line-height:1.6;}

/* ===== FAB ===== */
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;
  width:58px;height:58px;border-radius:999px;background:var(--black);color:var(--green-bright);
  border:none;font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.22);cursor:pointer;z-index:50;transition:transform .1s ease;font-weight:900;}
.fab:active{transform:scale(.93);}
.fab-menu{position:fixed;bottom:calc(144px + env(safe-area-inset-bottom));right:20px;
  display:flex;flex-direction:column;gap:10px;z-index:50;align-items:flex-end;}
.fab-menu-item{display:flex;align-items:center;gap:10px;cursor:pointer;}
.fab-menu-item .fab-mini{width:46px;height:46px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;}
.fab-menu-item .fab-label{background:var(--black);color:var(--green-bright);padding:7px 14px;
  border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
.fab-menu-item.asset .fab-mini{background:var(--black);color:var(--green-bright);}
.fab-menu-item.bill .fab-mini{background:var(--black);color:var(--green-bright);}

/* ===== Sheet / Modal ===== */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s ease;}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:#fff;
  border-radius:28px 28px 0 0;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);z-index:101;
  display:flex;flex-direction:column;overflow:hidden;}
.sheet.open{transform:translateY(0);}
.sheet-header{display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 14px;border-bottom:2px solid var(--line);flex-shrink:0;}
.sheet-header h2{font-family:'Inter',sans-serif;font-size:18px;font-weight:800;margin:0;color:var(--ink);}
.sheet-close{width:34px;height:34px;border-radius:50%;border:none;background:var(--paper-deep);
  color:var(--ink-soft);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.sheet-body{padding:16px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;flex:1;}

/* ===== Form fields ===== */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
.field input[type=text],.field input[type=number],.field input[type=date],
.field textarea,.field select{
  width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;
  background:#fff;font-size:15px;font-family:'Inter',sans-serif;color:var(--ink);outline:none;font-weight:500;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--black);}
.field textarea{resize:vertical;min-height:64px;}
.seg-control{display:flex;gap:8px;flex-wrap:wrap;}
.seg-btn{padding:9px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;
  color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;}
.seg-btn.active{background:var(--black);border-color:var(--black);color:var(--green-bright);}
.image-upload{width:100%;aspect-ratio:16/9;border:2px dashed var(--line);border-radius:16px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  color:var(--ink-faint);cursor:pointer;background:#fff;overflow:hidden;position:relative;}
.image-upload img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.image-upload .upload-hint,.image-upload .upload-icon{z-index:1;}
.image-upload .upload-icon{font-size:24px;}
.image-upload .upload-hint{font-size:12px;}
.image-upload.has-image .upload-hint,.image-upload.has-image .upload-icon{display:none;}
.accessory-row{display:flex;gap:8px;margin-bottom:8px;}
.accessory-row input{padding:10px 12px;border:2px solid var(--line);border-radius:12px;
  background:#fff;font-size:14px;font-family:'Inter',sans-serif;outline:none;width:100%;font-weight:500;}
.accessory-row input:focus{border-color:var(--black);}
.accessory-row input[type=text]{flex:2;}.accessory-row input[type=number]{flex:1;}
.accessory-remove{width:40px;height:40px;flex-shrink:0;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--rust);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-weight:700;}
.add-accessory-btn{width:100%;padding:11px;border-radius:12px;border:2px dashed var(--line);
  background:transparent;color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;margin-top:2px;}
.accessory-total{font-size:12px;color:var(--ink-soft);margin-top:8px;font-family:'JetBrains Mono',monospace;text-align:right;}
.accessory-total .num{font-weight:700;color:var(--ink);}
.target-result{margin-top:10px;padding:11px 13px;background:var(--green-soft);border-radius:12px;
  font-size:13px;color:var(--green-dark);line-height:1.6;font-weight:600;}
.target-result.over{background:var(--rust-soft);color:var(--rust);}
.target-sub-field{margin-top:10px;}
.reminder-toggle-row{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:14px;margin-top:8px;}
.reminder-toggle-row label{font-size:13px;font-weight:700;color:var(--ink);margin:0;}
.switch{position:relative;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:background .2s ease;}
.switch .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:transform .2s ease;}
.switch input:checked+.slider{background:var(--black);}
.switch input:checked+.slider::before{transform:translateX(18px);}
.btn{width:100%;padding:15px;border-radius:16px;border:none;font-size:15px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-primary{background:var(--black);color:var(--green-bright);}
.btn-primary:disabled{opacity:.4;}
.btn-danger{background:var(--rust-soft);color:var(--rust);margin-top:10px;}

/* ===== AI box ===== */
.ai-box{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;background:var(--green-soft);}
.ai-box.pending{background:var(--paper-deep);}
.ai-box.error{background:var(--rust-soft);}
.ai-box .ai-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
.ai-box.error .ai-eyebrow{color:var(--rust);}
.ai-box.pending .ai-eyebrow{color:var(--ink-soft);}
.ai-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
.ai-row .k{color:var(--ink-soft);}.ai-row .v{font-weight:600;}
.ai-suggestion{font-size:13px;color:var(--ink);margin-top:8px;line-height:1.6;}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--ink-faint);
  border-top-color:var(--ink-soft);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== Detail view ===== */
.detail-hero{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--paper-deep);
  margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:48px;border:1px solid var(--line);}
.detail-hero img{width:100%;height:100%;object-fit:cover;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:14px;}
.detail-row:last-child{border-bottom:none;}
.detail-row .k{color:var(--ink-soft);}.detail-row .v{font-weight:600;font-family:'JetBrains Mono',monospace;}
.compare-row{display:flex;gap:10px;margin-bottom:16px;}
.compare-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.compare-box .label{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
.compare-box .value{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
.compare-box.target .value{color:var(--amber);}
.compare-box.actual .value{color:var(--green);}
.accessory-list-view{margin-bottom:16px;}
.accessory-list-view .acc-item{display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13px;}
.accessory-list-view .acc-item:last-child{border-bottom:none;}
.accessory-list-view .acc-item .v{font-family:'JetBrains Mono',monospace;font-weight:600;}

/* ===== Finance page ===== */
.page-inner{padding:16px 20px 20px;}
.section-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 12px;}
.account-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.account-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.account-card .acc-info .acc-name{font-size:14px;font-weight:600;}
.account-card .acc-info .acc-type{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.account-card .acc-balance{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--green);}
.add-account-btn{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--line);
  background:transparent;color:var(--ink-soft);font-size:13px;font-weight:500;cursor:pointer;}

/* ===== Bills page ===== */
.month-group{margin-bottom:16px;}
.month-header{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:2px solid var(--line);cursor:pointer;margin-bottom:0;}
.month-header .month-label{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
.month-summary{display:flex;gap:12px;font-size:12px;font-family:'JetBrains Mono',monospace;}
.month-summary .inc{color:var(--green);}.month-summary .exp{color:var(--rust);}
.month-toggle{font-size:12px;color:var(--ink-faint);}
.month-body{overflow:hidden;}
.month-body.collapsed{display:none;}
.bill-item{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.bill-item:last-child{border-bottom:none;}
.bill-item .bill-left{display:flex;gap:10px;align-items:center;}
.bill-item .bill-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;}
.bill-item .bill-icon.income{background:var(--green-soft);}
.bill-item .bill-icon.expense{background:var(--rust-soft);}
.bill-item .bill-cat{font-size:13px;font-weight:500;}
.bill-item .bill-cat.salary{color:var(--green);font-weight:700;}
.bill-item .bill-date{font-size:11px;color:var(--ink-faint);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.bill-item .bill-amount{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;}
.bill-item .bill-amount.income{color:var(--green);}
.bill-item .bill-amount.expense{color:var(--rust);}

/* ===== Toast ===== */
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);
  padding:11px 22px;border-radius:999px;font-size:13px;z-index:200;opacity:0;
  transition:all .25s ease;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="topbar">
  <p class="eyebrow">个人资产登记</p>
  <h1>资产册</h1>
  <div class="stats-row">
    <div class="stat-box">
      <div class="label">净资产</div>
      <div class="value mono"><span class="unit">¥</span><span id="statNetWorth">0</span></div>
      <div class="sublabel">现金 + 资产剩余价值</div>
    </div>
    <div class="stat-box">
      <div class="label">资金总额</div>
      <div class="value mono"><span class="unit">¥</span><span id="statCash">0</span></div>
      <div class="sublabel">现金/存款/余额</div>
    </div>
    <div class="stat-box">
      <div class="label">日均成本</div>
      <div class="value mono"><span class="unit">¥</span><span id="statDaily">0</span></div>
      <div class="sublabel">服役中资产</div>
    </div>
  </div>
</header>

<!-- ===== Page: Assets ===== -->
<div class="page active" id="pageAssets">
  <div class="reminder-banner" id="reminderBanner" style="display:none;"></div>
  <div class="filter-bar" id="filterBar">
    <div class="chip active" data-filter="all">全部</div>
    <div class="chip" data-filter="electronics">电子设备</div>
    <div class="chip" data-filter="fixed">固定资产</div>
    <div class="chip" data-filter="serving">服役中</div>
    <div class="chip" data-filter="retired">已退役</div>
    <div class="chip" data-filter="sold">已卖出</div>
    <div class="chip" data-filter="expiring">即将到期</div>
  </div>
  <div class="list" id="assetList"></div>
</div>

<!-- ===== Page: Finance ===== -->
<div class="page" id="pageFinance">
  <div class="page-inner">
    <p class="section-title">资金账户</p>
    <div class="account-cards" id="accountCards"></div>
    <button class="add-account-btn" id="addAccountBtn">+ 添加账户</button>
  </div>
</div>

<!-- ===== Page: Bills ===== -->
<div class="page" id="pageBills">

function getQuip(asset){
  const days = daysBetween(asset.purchaseDate);
  const cost = totalCost(asset);
  const dc = cost / Math.max(days, 1);
  const lifespanDays = effectiveLifespanDays(asset);
  const progress = Math.round(days / lifespanDays * 100);
  const dleft = daysUntilExpiry(asset);

  // 每日随机种子：设备ID + 今天日期，每天换一次
  const today = new Date().toISOString().slice(0,10).replace(/-/g,"");
  const seed = parseInt(asset.id.replace(/\D/g,"").slice(-6) || "123") + parseInt(today);
  const rand = (n) => ((seed * 1103515245 + 12345) & 0x7fffffff) % n;

  // ── 快到期 / 已超期 ──
  if(dleft !== null && dleft <= 7){
    const emoji = dleft < 0 ? "💀" : "😱";
    const texts = dleft < 0
      ? [`我已经超期 ${Math.abs(dleft)} 天了，你还不让我退休？！`,
         `超出预计寿命了，主人，我真的撑不住了……`,
         `我的寿命早就该结束了，你是舍不得我还是舍不得钱？`]
      : [`还有 ${dleft} 天我就到期了，你打算怎么对我？`,
         `倒计时 ${dleft} 天！我的时间不多了，好好珍惜吧！`,
         `${dleft} 天后就是我的"退休日"，你准备好了吗？`];
    return { emoji, text: texts[rand(texts.length)] };
  }

  // ── 高日均（刚买不久的贵重品）──
  if(dc >= 50){
    const emoji = "😰";
    const texts = [
      `我每天要吞掉你 ¥${dc.toFixed(2)}，你今天努力搬砖了吗？`,
      `日均 ¥${dc.toFixed(2)}，这是你拿命换来的，好好用我！`,
      `目前服役进度才 ${progress}%，别想了，我们还有很长的路要走。`,
      `¥${dc.toFixed(2)}/天，比你的外卖还贵，你值这个价吗？`
    ];
    return { emoji, text: texts[rand(texts.length)] };
  }

  // ── 新设备（使用不足30天）──
  if(days <= 30){
    const emoji = "🥰";
    const texts = [
      `我们才认识 ${days} 天，蜜月期好好珍惜我吧！`,
      `刚来就被这么重用，我很感动！好好对我，我会回报你的。`,

      `我们的故事才刚开始，期待和你一起走过每一天！`
    ];
    return { emoji, text: texts[rand(texts.length)] };
  }

  // ── 低日均劳模（日均<5元且超过1年）──
  if(dc < 5 && days > 365){
    const emoji = "😎";
    const texts = [
      `日均才 ¥${dc.toFixed(2)}，我已经是全家最省心的劳模了，求求对我好点！`,
      `服役了 ${days} 天，我陪你的时间比任何人都长。`,

      `${days} 天风雨陪你走，这段感情你敢辜负吗？`
    ];
    return { emoji, text: texts[rand(texts.length)] };
  }

  // ── 临近到期（进度 85%-90%）──
  if(progress >= 85){
    const emoji = "😔";
    const texts = [
      `服役进度 ${progress}% 了……主人，我感觉自己越来越力不从心了。`,

  const emoji = generalEmojis[rand(generalEmojis.length)];

/* ============================================================
   CALC UTILS
============================================================ */
function daysBetween(a, b){
  const s = new Date(a+"T00:00:00");
  const e = b ? new Date(b+"T00:00:00") : new Date();
  return Math.max(Math.floor((e-s)/86400000), 0);
}
function totalCost(a){
  return (Number(a.price)||0) + (a.accessories||[]).reduce((s,x)=>s+(Number(x.price)||0),0);
}
function effectiveExpiryDate(a){
  if(a.targetCostMode==="date" && a.customExpiryDate) return a.customExpiryDate;
  if(a.targetCostMode==="days" && a.targetDays) return addDays(a.purchaseDate, Number(a.targetDays));
  if(a.targetCostMode==="daily" && a.targetDailyCost){
    return addDays(a.purchaseDate, Math.ceil(totalCost(a)/Number(a.targetDailyCost)));
  }
  return a.expiryDate;
}
function effectiveLifespanDays(a){
  const e = effectiveExpiryDate(a);
  if(!e) return (a.expectedLifespanYears||5)*365;
  return Math.max(daysBetween(a.purchaseDate, e), 1);
}
function daysUntilExpiry(a){
  const e = effectiveExpiryDate(a);
  if(!e) return null;
  return Math.floor((new Date(e+"T00:00:00") - new Date(new Date().toISOString().slice(0,10)+"T00:00:00"))/86400000);
}
function addDays(d, n){
  const dt = new Date(d+"T00:00:00"); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10);
}
function addYears(d, y){
  const dt = new Date(d+"T00:00:00"); dt.setFullYear(dt.getFullYear()+y); return dt.toISOString().slice(0,10);
}
function dailyCost(cost, days){ return days<=0 ? cost : cost/days; }
function fmtMoney(n){ return Number(n).toLocaleString("zh-CN",{maximumFractionDigits:0}); }
function fmtDaily(n){ return Number(n).toFixed(2); }
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

/* ============================================================
   STATS
============================================================ */
function renderStats(){
  // 资金总额
  const cash = accounts.reduce((s,a)=>s+Number(a.balance),0);
  // 资产剩余价值
  let assetResidual = 0;
  assets.forEach(a=>{
    if(a.status==="sold") return;
    const cost = totalCost(a);
    const days = daysBetween(a.purchaseDate);
    const lifespan = effectiveLifespanDays(a);
    const dc = cost/Math.max(lifespan,1);
    const residual = Math.max(cost - dc*days, 0);
    assetResidual += residual;
  });
  const netWorth = cash + assetResidual;
  // 日均
  let dailyTotal = 0;
  assets.forEach(a=>{
    if(a.status!=="serving") return;
    const cost = totalCost(a);
    const days = daysBetween(a.purchaseDate);
    dailyTotal += dailyCost(cost, days);
  });
  document.getElementById("statNetWorth").textContent = fmtMoney(netWorth);
  document.getElementById("statCash").textContent     = fmtMoney(cash);
  document.getElementById("statDaily").textContent    = fmtDaily(dailyTotal);
  renderReminderBanner();
}

function renderReminderBanner(){
  const banner = document.getElementById("reminderBanner");
  const reminders = assets.filter(a=>a.status==="serving"&&a.reminderEnabled&&daysUntilExpiry(a)!==null&&daysUntilExpiry(a)<=7);
  if(!reminders.length){ banner.style.display="none"; return; }
  const overdue = reminders.filter(a=>daysUntilExpiry(a)<0).length;
  const upcoming = reminders.filter(a=>daysUntilExpiry(a)>=0).length;
  let text = "";
  if(overdue) text += `<b>${overdue}</b> 件已超期`;
  if(upcoming) text += (text?`，`:"")+`<b>${upcoming}</b> 件即将到期`;
  banner.innerHTML = `<span style="font-size:16px;">⏰</span><span class="text">${text}，点击查看</span>`;
  banner.style.display="flex";
  banner.onclick=()=>{ setFilter("expiring"); switchPage("pageAssets"); };
}

function passesFilter(a){
  switch(currentFilter){
    case "all": return true;
    case "electronics": return a.group==="electronics";
    case "fixed": return a.group==="fixed";
    case "serving": return a.status==="serving";
    case "retired": return a.status==="retired";
    case "sold": return a.status==="sold";
    case "expiring": { const d=daysUntilExpiry(a); return a.status==="serving"&&d!==null&&d<=7; }
    default: return true;
  }
}

function renderAssetList(){
  const el = document.getElementById("assetList");
  const filtered = assets.filter(passesFilter);
  if(!filtered.length){
    el.innerHTML=`<div class="empty-state"><div class="icon">🗂️</div><h3>这里还空着</h3><p>点击右下角「+」登记第一件资产</p></div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b)=>{
    const o={serving:0,retired:1,sold:2};
    if(o[a.status]!==o[b.status]) return o[a.status]-o[b.status];
    return new Date(b.purchaseDate)-new Date(a.purchaseDate);
  });
  el.innerHTML = sorted.map(a=>{
    const days = daysBetween(a.purchaseDate);
    const lifespanDays = effectiveLifespanDays(a);
    const ratio = Math.min(days/lifespanDays, 1.3);
    const pct = Math.min(ratio*100, 100);
    let gc="ok", sw="良好";
    if(ratio>=1){gc="over";sw="已超期";}
    else if(ratio>=.85){gc="warn";sw="临近到期";}
    const cost = totalCost(a);
    const dc = dailyCost(cost, days);
    const icon = ALL_ICONS[a.category]||"📦";
    const thumb = a.image ? `<img src="${a.image}" alt="">` : icon;
    const stags = {serving:`<span class="status-tag serving">服役中</span>`,
                   retired:`<span class="status-tag retired">已退役</span>`,
                   sold:`<span class="status-tag sold">已卖出</span>`};
    let targetHint="";
    if(a.targetCostMode&&a.targetCostMode!=="none"){
      const dl=daysUntilExpiry(a);
      if(dl!==null){
        if(dl<0) targetHint=`<span class="status-tag sold">超期${Math.abs(dl)}天</span>`;
        else if(dl<=30) targetHint=`<span class="status-tag serving">还剩${dl}天</span>`;
      }
    }
    const quip = getQuip(a);
    return `<div class="card" data-id="${a.id}">
      <div class="card-top">
        <div class="card-thumb">${thumb}</div>
        <div class="card-info">
          <div class="card-name">${escapeHtml(a.name)}</div>
          <div class="card-meta">${a.category}<span class="sep">·</span>已用${days}天 ${stags[a.status]}${targetHint}</div>
          <div class="card-numbers">
            <div class="card-price">¥${fmtMoney(cost)}</div>
            <div class="card-daily">日均 <span class="num">¥${fmtDaily(dc)}</span></div>
          </div>
        </div>
      </div>
      <div class="gauge-row">
        <div class="gauge-labels">
          <span>服役进度</span>
          <span class="gauge-status ${gc}">${Math.round(ratio*100)}% · ${sw}</span>
        </div>
        <div class="gauge-track"><div class="gauge-fill ${gc}" style="width:${pct}%"></div></div>
      </div>
      <div class="quip-bubble">
        <div class="quip-badge">${quip.emoji}</div>
        <div class="quip-text">${escapeHtml(quip.text)}</div>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openDetail(c.dataset.id)));

      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);

});

function setTargetModeSeg(mode){
  document.querySelectorAll("#targetModeSeg .seg-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  document.getElementById("targetDailyField").style.display=mode==="daily"?"block":"none";

  document.getElementById(id).addEventListener("input",updateTargetResult));

function updateTargetResult(){
  const mode=getActiveSeg("targetModeSeg","mode")||"none";
  const el=document.getElementById("targetResult");
  const pd=document.getElementById("fieldDate").value;
  const accs=getAccessories();
  const main=Number(document.getElementById("fieldPrice").value)||0;
  const cost=main+accs.reduce((s,a)=>s+a.price,0);
  if(mode==="none"||!pd||cost<=0){el.style.display="none";return;}
  el.style.display="block";
  if(mode==="daily"){
    const t=Number(document.getElementById("targetDailyValue").value);
    if(!t){el.textContent="请输入目标日均成本";return;}
    const nd=Math.ceil(cost/t), td=addDays(pd,nd), rem=nd-daysBetween(pd);
    el.className=rem<=0?"target-result over":"target-result";
    el.innerHTML=rem<=0?`🎉 已达成！`:`需 <b>${nd}</b> 天达成，到期日 <b>${td}</b>，还需 <b>${rem}</b> 天`;
  }else if(mode==="days"){
    const d=Number(document.getElementById("targetDaysValue").value);
    if(!d){el.textContent="请输入目标天数";return;}
    const td=addDays(pd,d), rem=d-daysBetween(pd), dc=fmtDaily(cost/d);
    el.className=rem<=0?"target-result over":"target-result";
    el.innerHTML=rem<=0?`已超过目标天数`:`到期日 <b>${td}</b>，还需 <b>${rem}</b> 天，目标日均 <b>¥${dc}</b>`;
  }else if(mode==="date"){
    const date=document.getElementById("targetDateValue").value;
    if(!date){el.textContent="请选择到期日";return;}
    const dt=daysBetween(pd,date), rem=dt-daysBetween(pd), dc=fmtDaily(cost/Math.max(dt,1));
    el.className=rem<=0?"target-result over":"target-result";
    el.innerHTML=rem<=0?`已到达设定到期日`:`到期日 <b>${date}</b>，还剩 <b>${rem}</b> 天，日均将达 <b>¥${dc}</b>`;
  }
}

/* AI */
async function callDify(name,category,price,purchaseDate){
  const ab=document.getElementById("aiBox"), ac=document.getElementById("aiContent");
  ab.style.display="block"; ab.className="ai-box pending";
  ac.innerHTML=`<span class="spinner"></span>正在分析使用寿命…`;
  try{
    const r=await fetch(`${DIFY_BASE_URL}/workflows/run`,{method:"POST",
      headers:{"Authorization":`Bearer ${DIFY_API_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({inputs:{device_name:name,category,price:Number(price),purchase_date:purchaseDate},
        response_mode:"blocking",user:"asset-ledger-user"})});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json(); const out=d.data?.outputs;
    if(!out) throw new Error("无输出");
    const res={expectedLifespanYears:out.expected_lifespan_years,expiryDate:out.expiry_date,suggestionText:out.suggestion_text};
    pendingAI=res; showAIResult(res); return res;
  }catch(err){
    ab.className="ai-box error";
    ac.innerHTML=`AI 分析失败，使用默认值（5年）<br><span style="font-size:11px;color:var(--ink-faint)">${err.message}</span>`;
    pendingAI={expectedLifespanYears:5,expiryDate:addYears(purchaseDate,5),suggestionText:"建议定期检查设备状态。"};
    showAIResult(pendingAI,true); return pendingAI;
  }
}
function showAIResult(r,isErr){
  const ab=document.getElementById("aiBox"), ac=document.getElementById("aiContent");
  ab.style.display="block"; if(!isErr) ab.className="ai-box";
  ac.innerHTML=`<div class="ai-row"><span class="k">预计使用寿命</span><span class="v">${r.expectedLifespanYears} 年</span></div>
    <div class="ai-row"><span class="k">预计到期日</span><span class="v">${r.expiryDate}</span></div>
    <div class="ai-suggestion">${escapeHtml(r.suggestionText||"")}</div>`;
}

document.getElementById("saveAssetBtn").addEventListener("click", async()=>{
  const name=document.getElementById("fieldName").value.trim();
  const price=document.getElementById("fieldPrice").value;
  const purchaseDate=document.getElementById("fieldDate").value;
  if(!name||!price||!purchaseDate){ showToast("请填写名称、价格和购买日期"); return; }
  const group=getActiveSeg("groupSeg","group");

  const targetDailyCost=Number(document.getElementById("targetDailyValue").value)||null;
  const targetDays=Number(document.getElementById("targetDaysValue").value)||null;
  const customExpiryDate=document.getElementById("targetDateValue").value||null;
  const reminderEnabled=document.getElementById("reminderToggle").checked;
  const btn=document.getElementById("saveAssetBtn"); btn.disabled=true; btn.textContent="处理中…";
  let aiResult=pendingAI;

    ||Number(existing.price)!==Number(price)||existing.purchaseDate!==purchaseDate||!existing.suggestionText;

    status,note,image,accessories,targetCostMode,targetDailyCost,targetDays,customExpiryDate,reminderEnabled,
    expectedLifespanYears:aiResult.expectedLifespanYears,expiryDate:aiResult.expiryDate,suggestionText:aiResult.suggestionText};
  if(editingAssetId){ assets[assets.findIndex(a=>a.id===editingAssetId)]=record; }
  else{ assets.push(record); }
  saveAssets(); renderStats(); renderAssetList(); closeAssetForm(); showToast(editingAssetId?"已更新":"已添加");

});

  const balance=document.getElementById("accBalance").value;
  if(!name||balance===""){showToast("请填写账户名称和余额");return;}
  const rec={id:editingAccountId||("acc"+Date.now()),name,type:document.getElementById("accType").value,
    balance:Number(balance),note:document.getElementById("accNote").value.trim()};
  if(editingAccountId){accounts[accounts.findIndex(a=>a.id===editingAccountId)]=rec;}
  else{accounts.push(rec);}
  saveAccounts();renderStats();renderFinancePage();closeAccountForm();showToast(editingAccountId?"已更新":"已添加");
});
document.getElementById("deleteAccountBtn").addEventListener("click",()=>{
  if(!editingAccountId||!confirm("确定删除？"))return;
  accounts=accounts.filter(a=>a.id!==editingAccountId);
  saveAccounts();renderStats();renderFinancePage();closeAccountForm();showToast("已删除");
});

/* ============================================================
   BILLS PAGE
============================================================ */
function renderBillsPage(){
  const el=document.getElementById("billList");
  if(!bills.length){
    el.innerHTML=`<div class="empty-state" style="padding:30px 0;"><div class="icon">📊</div><h3>还没有账单</h3><p>点击右下角「+」记一笔账单</p></div>`;
    return;
  }
  // 按月分组
  const groups={};
  bills.forEach(b=>{
    const m=b.date.slice(0,7);
    if(!groups[m]) groups[m]={income:0,expense:0,items:[]};
    if(b.type==="income") groups[m].income+=Number(b.amount);
    else groups[m].expense+=Number(b.amount);
    groups[m].items.push(b);
  });
  const months=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  el.innerHTML=months.map(m=>{
    const g=groups[m];
    const sorted=[...g.items].sort((a,b)=>b.date.localeCompare(a.date));
    return `<div class="month-group">
      <div class="month-header" data-month="${m}">
        <span class="month-label">${m.replace("-","年")}月</span>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="month-summary">
            <span class="inc">+¥${fmtMoney(g.income)}</span>
            <span class="exp">-¥${fmtMoney(g.expense)}</span>
          </div>
          <span class="month-toggle">▾</span>
        </div>
      </div>
      <div class="month-body" id="mb-${m}">
        ${sorted.map(b=>{
          const isSalary=b.type==="income"&&b.category==="工资收入";
          const catIcon=b.type==="income"?"💚":"🔴";
          return `<div class="bill-item" data-id="${b.id}">
            <div class="bill-left">
              <div class="bill-icon ${b.type}">${catIcon}</div>
              <div>
                <div class="bill-cat${isSalary?" salary":""}">${escapeHtml(b.category)}</div>
                <div class="bill-date">${b.date}${b.note?` · ${escapeHtml(b.note)}`:""}</div>
              </div>
            </div>
            <div class="bill-amount ${b.type}">${b.type==="income"?"+":"-"}¥${fmtMoney(b.amount)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");

  // 折叠逻辑
  el.querySelectorAll(".month-header").forEach(h=>{
    h.addEventListener("click",()=>{
      const body=document.getElementById("mb-"+h.dataset.month);
      const tog=h.querySelector(".month-toggle");
      const collapsed=body.classList.toggle("collapsed");
      tog.textContent=collapsed?"▸":"▾";
    });
  });
  el.querySelectorAll(".bill-item").forEach(item=>{
    item.addEventListener("click",()=>openBillForm(bills.find(b=>b.id===item.dataset.id)));
  });
}

/* Bill form */
function setBillCategoryOptions(type){
  const sel=document.getElementById("billCategory");
  const cats=type==="income"?INCOME_CATS:EXPENSE_CATS;
  sel.innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join("");
}
function setBillTypeSeg(type){
  document.querySelectorAll("#billTypeSeg .seg-btn").forEach(b=>b.classList.toggle("active",b.dataset.btype===type));
  setBillCategoryOptions(type);
}
document.getElementById("billTypeSeg").addEventListener("click",e=>{
  const b=e.target.closest(".seg-btn"); if(!b) return; setBillTypeSeg(b.dataset.btype);
});

function populateAccountSelect(){
  const sel=document.getElementById("billAccount");
  sel.innerHTML=`<option value="">不关联</option>`+accounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");
}
function openBillForm(bill){
  editingBillId=bill?.id||null;
  document.getElementById("billFormTitle").textContent=bill?"编辑账单":"记一笔账单";
  document.getElementById("deleteBillBtn").style.display=bill?"block":"none";
  setBillTypeSeg(bill?.type||"income");
  document.getElementById("billCategory").value=bill?.category||"";
  document.getElementById("billAmount").value=bill?.amount||"";
  document.getElementById("billDate").value=bill?.date||new Date().toISOString().slice(0,10);
  document.getElementById("billNote").value=bill?.note||"";
  populateAccountSelect();
  document.getElementById("billAccount").value=bill?.accountId||"";
  document.getElementById("billOverlay").classList.add("open");
  document.getElementById("billSheet").classList.add("open");
}
function closeBillForm(){
  document.getElementById("billOverlay").classList.remove("open");
  document.getElementById("billSheet").classList.remove("open");
}
document.getElementById("billFormClose").addEventListener("click",closeBillForm);
document.getElementById("billOverlay").addEventListener("click",closeBillForm);
document.getElementById("saveBillBtn").addEventListener("click",()=>{
  const amount=document.getElementById("billAmount").value;
  const date=document.getElementById("billDate").value;
  const category=document.getElementById("billCategory").value;
  if(!amount||!date){showToast("请填写金额和日期");return;}
  const type=getActiveSeg("billTypeSeg","btype")||"income";
  const rec={id:editingBillId||("b"+Date.now()),type,category,amount:Number(amount),date,
    accountId:document.getElementById("billAccount").value||null,
    note:document.getElementById("billNote").value.trim()};
  if(editingBillId){bills[bills.findIndex(b=>b.id===editingBillId)]=rec;}
  else{bills.push(rec);}
  saveBills();renderBillsPage();renderStats();closeBillForm();showToast(editingBillId?"已更新":"已记录");
});
document.getElementById("deleteBillBtn").addEventListener("click",()=>{
  if(!editingBillId||!confirm("确定删除？"))return;
  bills=bills.filter(b=>b.id!==editingBillId);
  saveBills();renderBillsPage();renderStats();closeBillForm();showToast("已删除");
});

/* ============================================================
   TOAST
============================================================ */
let toastTimer;
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ============================================================
   INIT
============================================================ */
setGroup("electronics",null);
setBillTypeSeg("income");
load();
renderStats();
renderAssetList();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
}
</script>
